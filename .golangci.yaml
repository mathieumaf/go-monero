version: "2"

run:
  timeout: 5m

linters:
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gosec
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - testpackage
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G115 # integer overflow on conversions; noisy false positives
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # the CLI legitimately writes to stdout.
      - path: cmd/
        linters:
          - forbidigo
      # test helpers carry unused signature params by design.
      - path: _test\.go
        linters:
          - revive
          - paralleltest
          - funlen
          - goconst
    paths:
      - pkg/levin # needs to be refactored anyway

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mathieumaf/go-monero
